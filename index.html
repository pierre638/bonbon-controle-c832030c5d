<style>
:root{--bg:#fbf7f4;--card:#fff;--ink:#231d20;--mut:#6c6165;--line:#eaded9;--pink:#ff80c4;--pinkd:#c42a78;--ko:#a32428}
@media(prefers-color-scheme:dark){:root{--bg:#171316;--card:#221c20;--ink:#f1e9ec;--mut:#a9a0a4;--line:#3b3237;--pinkd:#ff8fcb;--ko:#ff9da0}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree",system-ui,sans-serif;padding:16px}
main{width:100%;max-width:420px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pinkd)}
h1{font-size:2.2rem;line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:.25em 0 .3em}
p{color:var(--mut);margin:0 0 18px}form{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pink);border-radius:10px;padding:18px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--pinkd);outline-offset:2px}
button{margin-top:12px;width:100%;font:inherit;font-weight:800;padding:11px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
#err{color:var(--ko);font-size:.88rem;margin-top:10px;min-height:1.3em}
</style></head><body>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  const html=await open_(pw);
  if(remember){try{sessionStorage.setItem('k',pw)}catch(e){}}
  const hash=location.hash;
  document.open();document.write(html);document.close();
  if(hash){setTimeout(()=>{location.hash='';location.hash=hash},50)}
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='';
  try{await go(document.getElementById('pw').value,true)}catch(x){err.textContent='Mot de passe incorrect.'}
});
try{const k=sessionStorage.getItem('k');if(k)go(k,false).catch(()=>{})}catch(e){}
</script></body></html>
